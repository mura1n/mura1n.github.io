name: Build and deploy homepage

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Use a Ruby 3.3-compatible lockfile, separate from the local Ruby 2.6 preview.
      BUNDLE_GEMFILE: Gemfile.ci
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - name: Build the original Jekyll template
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check output
        run: python3 tests/check_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
